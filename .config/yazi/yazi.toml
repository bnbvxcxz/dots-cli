#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
show_hidden = true
confirm_overwrite = true
mouse_events = [ "click", "scroll", "drag" ]

[opener]
edit = [
    { run = 'micro %s', block = true, desc = "micro" },
]
video = [
    { run = 'haruna %s', orphan = true, desc = "Haruna" },
]
image = [
    { run = 'qimgv %s', orphan = true, desc = "qimgv" },
]

[open]
rules = [
    # Media
    { mime = "image/*",        use = "image" },
    { mime = "video/*",        use = "video" },
    { mime = "audio/*",        use = "video" },

    # Archive extraction menu
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },

    # Catch-all fallback
    { url = "*",               use = "edit" },
]

[plugin]
prepend_previewers = [
    # Formatted Markdown
    { url = "*.md",                          run = "rich-preview" },

    # Archive inspection
    { mime = "application/*zip*",            run = "ouch" },
    { mime = "application/x-tar",            run = "ouch" },
    { mime = "application/x-bzip2",          run = "ouch" },
    { mime = "application/x-7z-compressed",  run = "ouch" },
    { mime = "application/x-rar",            run = "ouch" },
    { mime = "application/zstd",             run = "ouch" },

    # Audio metadata & cover art
    { mime = "audio/*",                      run = "exifaudio" },

    # Tabular data
    { url = "*.csv",                         run = "duckdb" },
    { url = "*.tsv",                         run = "duckdb" },
    { url = "*.parquet",                     run = "duckdb" },
]
