#
# Configuration
font_family                 JetBrainsMono Nerd Font
font_size                   9
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
cursor_shape beam
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.7
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

# Include wallpaper colors
include colors-matugen.conf

# Allow programs to r/w to the clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Drop all built-in shortcuts
clear_all_shortcuts yes

# Disable splits & tab bar
enabled_layouts splits:none
tab_bar_style hidden

# Restore the clipboard & font binds only
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+f5 load_config_file
